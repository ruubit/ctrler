<!DOCTYPE html>
<html lang="en">

<head>
    <title>Ctrler</title>
    <link href="frontend/style.css" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div id="app">
        <div id="light">
        </div>
        <div id="remote">
            <div id="button-grid">
                <div class="cell">
                    <button id="play"><span class="icon">&#x25B6;&#xFE0E;</span><br>play</button>
                </div>
                <div class="cell">
                    <button id="pause"><span class="icon">&#x23F8;&#xFE0E;</span><br>pause</button>
                </div>
                <div class="cell">
                    <button id="rewind"><span class="icon">&#x25C0;&#x25C0;</span><br>rewind</button>
                </div>
                <div class="cell">
                    <button id="forward"><span class="icon">&#x25B6;&#x25B6;</span><br>forward</button>
                </div>
            </div>
            <div id="logo">
                <h1>Ctrler</h1>
            </div>
        </div>
    </div>
    <script src="frontend/app.js"></script>
</body>

</html>
